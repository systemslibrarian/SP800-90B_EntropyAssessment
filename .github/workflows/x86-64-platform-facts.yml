name: x86-64 platform facts

# WHY THIS EXISTS
#
# Every float-environment claim in audits/2026-10-11-independent-audit/ is
# measured on Apple arm64, where `long double` IS IEEE double (53-bit
# significand, emin -1021) -- the NARROWEST of the three formats a build of this
# tool can land on. x87 extended (x86-64) and binary128 (Linux aarch64) share
# emin -16382. Three things were therefore arguments from reading the source
# rather than observations, and CLOSING-INVENTORY.md listed them as needing "one
# machine briefly":
#
#   * the four provenance-canary signatures (OC-24, OC-30)
#   * REPRO-01, whose verdict differs by long double width
#   * R-1, re-labelled NOT-REPRODUCIBLE-HERE by OC-34 -- its assert does not
#     fire on this platform and nothing in the fork fixed it, so it is
#     rounding-sensitive and its reachability elsewhere was unknown
#
# ubuntu-latest is x86-64 Linux on glibc, where `long double` is x87 80-bit
# extended. So the machine is a workflow file. Manually triggered: this answers
# questions, it does not gate anything.
#
# The platform is PRINTED, never assumed: step 1 records the actual float
# environment, and every later conclusion is read against it.
#
# ABSENCE RULE (OC-36). No step below concludes anything from a missing line
# without first confirming the output is a well-formed report of the expected
# kind. A usage message, an empty file, a crash and a completed run that lacks
# a given line are four distinguishable outcomes and only the last is evidence.

on:
  # Promoted from manual-only on 2026-10-19. Its first run found a live defect
  # (R-1 on x86-64), a guard coupled to the host's wording of an assertion, and
  # the first second-platform confirmation of the outside-battery figures. The
  # class it detects -- a claim true only on the development host -- is
  # invisible from that host by construction, so it runs on every push.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tag build needs history

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbz2-dev libdivsufsort-dev \
                                  libjsoncpp-dev libssl-dev python3 python3-pip \
                                  python3-yaml clang libomp-dev
          # python3-yaml is NAMED rather than assumed: regression-workflows.sh
          # parses the workflow YAML and, without PyYAML, reports COULD NOT RUN
          # (exit 2) -- correct behaviour, and it would add a SECOND abstention
          # where the gate below expects exactly one, so the job would go red
          # for a missing package rather than for a defect. The runner image
          # happens to carry it; a dependency that happens to be present is not
          # a dependency that was declared.
          # regression-estimator-guards builds its own clang sanitizer binary and
          # needs omp.h; without libomp-dev it reports COULD NOT RUN, which is
          # neither a pass nor a failure and also not a measurement.
          python3 -m pip install --quiet mpmath || true
          mkdir -p logs

      - name: 1. Print the float environment (the platform fact, not an argument)
        run: |
          cat > /tmp/fp.c <<'EOF'
          #include <stdio.h>
          #include <float.h>
          int main(void){
            printf("uname/arch recorded separately\n");
            printf("sizeof(long double) = %zu\n", sizeof(long double));
            printf("LDBL_MANT_DIG   = %d\n", LDBL_MANT_DIG);
            printf("LDBL_MIN_EXP    = %d\n", LDBL_MIN_EXP);
            printf("LDBL_MIN        = %Lg\n", LDBL_MIN);
            printf("LDBL_TRUE_MIN   = %Lg\n", LDBL_TRUE_MIN);
            printf("LDBL_EPSILON    = %Lg\n", LDBL_EPSILON);
          #ifdef FLT_EVAL_METHOD
            printf("FLT_EVAL_METHOD = %d\n", FLT_EVAL_METHOD);
          #else
            printf("FLT_EVAL_METHOD = (not defined)\n");
          #endif
            printf("DBL_MANT_DIG    = %d\n", DBL_MANT_DIG);
            /* The thresholds the canary signatures depend on. */
            printf("W such that 0.5^W < LDBL_MIN  -> W > %.0f\n", -1.0*LDBL_MIN_EXP + 1);
            return 0;
          }
          EOF
          gcc -O0 -o /tmp/fp /tmp/fp.c
          { uname -a; gcc --version | head -1; /tmp/fp; } | tee logs/01-float-environment.log
          # The whole job is interpretable only if this is the wide format.
          mant=$(sed -n 's/^LDBL_MANT_DIG *= *//p' logs/01-float-environment.log)
          emin=$(sed -n 's/^LDBL_MIN_EXP *= *//p' logs/01-float-environment.log)
          echo "LDBL_MANT_DIG=${mant} LDBL_MIN_EXP=${emin}" >> "$GITHUB_ENV"
          if [ "${mant}" = "64" ] && [ "${emin}" = "-16381" ]; then
            echo "PLATFORM: x87 80-bit extended, as expected for x86-64 glibc" | tee -a logs/01-float-environment.log
          else
            echo "PLATFORM: NOT the expected x87 extended format (mant ${mant}, emin ${emin})." | tee -a logs/01-float-environment.log
            echo "Every conclusion below is about THIS format, whatever it is. Read the log." | tee -a logs/01-float-environment.log
          fi

      - name: 2. Build master (asserts live) and -DNDEBUG
        run: |
          set -x
          ( cd cpp && make non_iid iid restart ) 2>&1 | tee logs/02-build-master.log
          mkdir -p /tmp/bins
          cp cpp/ea_iid /tmp/bins/ea_iid.master.live
          cp cpp/ea_non_iid /tmp/bins/ea_non_iid.master
          cp cpp/ea_restart /tmp/bins/ea_restart.master
          ( cd cpp && make -B CXX="g++ -DNDEBUG" iid ) 2>&1 | tee -a logs/02-build-master.log
          cp cpp/ea_iid /tmp/bins/ea_iid.master.ndebug
          ( cd cpp && make -B iid ) 2>&1 | tee -a logs/02-build-master.log
          sha256sum /tmp/bins/* | tee logs/02-binaries.sha256

      - name: 3. Build the unrepaired reference from the tag
        run: |
          set -x
          git worktree add /tmp/tagwt unrepaired-reference-2026-10-15
          ( cd /tmp/tagwt/cpp && make iid ) 2>&1 | tee logs/03-build-tag.log
          cp /tmp/tagwt/cpp/ea_iid /tmp/bins/ea_iid.tag.live
          ( cd /tmp/tagwt/cpp && make -B CXX="g++ -DNDEBUG" iid ) 2>&1 | tee -a logs/03-build-tag.log
          cp /tmp/tagwt/cpp/ea_iid /tmp/bins/ea_iid.tag.ndebug
          sha256sum /tmp/bins/* | tee -a logs/02-binaries.sha256
          # BUILD STATE AS A PRECONDITION (OC-43): print what each binary
          # actually is before any measurement reads it. The error this guards
          # is a worktree holding a binary from earlier work (OC-42).
          . cpp/selftest/buildstate-lib.sh
          bs_print /tmp/bins/* | tee logs/02-build-state.log

      - name: 4. The canary, all four builds plus a non-tool control
        run: |
          set +e
          for c in master.live master.ndebug tag.live tag.ndebug; do
            echo "===== ea_iid.${c}" | tee -a logs/04-canary.log
            tools/build-provenance-canary.sh "/tmp/bins/ea_iid.${c}" >> logs/04-canary.log 2>&1
            echo "canary exit $?" >> logs/04-canary.log
          done
          echo "===== /bin/ls (control: must be INDETERMINATE)" >> logs/04-canary.log
          tools/build-provenance-canary.sh /bin/ls >> logs/04-canary.log 2>&1
          echo "canary exit $?" >> logs/04-canary.log
          # Report the TREE/BUILD pairs, which is what OC-24/OC-30 argued for.
          grep -E '^=====|^canary: (TREE|BUILD|exit)' logs/04-canary.log | tee logs/04-canary-summary.log

      - name: 5. R-1 at all five symbol counts (settles NOT-REPRODUCIBLE-HERE)
        run: |
          set +e
          # Absence rule: a usage message, a crash and a completed run that
          # lacks a line are different outcomes. Classify on POSITIVE markers.
          for spec in 3:2 6:3 7:3 9:4 12:4; do
            k=${spec%%:*}; w=${spec#*:}
            python3 - "$k" <<'PY'
          import random, sys
          k = int(sys.argv[1]); L = (1000000 // k + 1) * k
          r = random.Random(7)
          a = [i % k for i in range(L)]
          r.shuffle(a)
          open('/tmp/bal%d.bin' % k, 'wb').write(bytes(a))
          print('k=%d L=%d counts=%d' % (k, L, L // k))
          PY
            OMP_NUM_THREADS=2 timeout 1200 /tmp/bins/ea_iid.master.live -v "/tmp/bal${k}.bin" "$w" > "/tmp/bal${k}.out" 2>&1
            rc=$?
            if grep -qi 'assertion' "/tmp/bal${k}.out"; then
              verdict="ABORTED: $(grep -i assertion "/tmp/bal${k}.out" | head -1)"
            elif grep -qi 'usage is' "/tmp/bal${k}.out"; then
              verdict="HARNESS ERROR: the tool printed usage; nothing was tested"
            elif grep -qE '^\*\* (Passed|Failed) ' "/tmp/bal${k}.out"; then
              verdict="completed the battery without aborting (rc ${rc}): $(grep -oE '^\*\* (Passed|Failed) [a-z ]+' "/tmp/bal${k}.out" | head -1)"
            elif [ "${rc}" -eq 124 ]; then
              verdict="TIMED OUT before any verdict line (rc 124) -- no conclusion"
            else
              verdict="INCONCLUSIVE (rc ${rc}): $(tail -1 "/tmp/bal${k}.out")"
            fi
            echo "k=${k} width=${w}: ${verdict}" | tee -a logs/05-r1.log
          done

      - name: 5b. R-1's blast radius through the production functions
        run: |
          set +e
          g++ -std=c++11 -fopenmp -O2 -I/usr/include/jsoncpp \
              -Icpp/shared -Icpp/non_iid \
              audits/2026-10-11-independent-audit/reproducers/r1_pcol_sweep.cpp \
              -o /tmp/r1sweep -lbz2 -lpthread -ldivsufsort -ldivsufsort64 \
              -ljsoncpp -lcrypto 2>&1 | tail -5
          if [ -x /tmp/r1sweep ]; then
            /tmp/r1sweep > logs/05b-r1-blast-radius.log 2>&1
            echo "sweep exit $?" >> logs/05b-r1-blast-radius.log
            grep -E 'sizeof|aborting alphabet|^aborting k|powers of two|width 1|still aborting' \
                 logs/05b-r1-blast-radius.log
          else
            echo "SWEEP DID NOT BUILD; no blast-radius measurement on this platform" \
                 | tee logs/05b-r1-blast-radius.log
          fi

      - name: "5c. getopt PERMUTATION as a libc fact, and the refusal that now covers it"
        run: |
          # A PROBE THAT MEASURES EXIT STATUSES MUST NOT RUN UNDER set -e
          # (OC-97). GitHub runs `run:` blocks as `bash -e`, so the FIRST
          # measured non-zero status aborted this step -- exit 255, the tool's
          # usage status, which is the very thing being measured. Step 6 was
          # then skipped, so this probe hid the full suite: OC-84's failure
          # mode exactly, from a different cause, four commits after that entry
          # was written.
          #
          # So: set +e, and the step always exits 0. What judges it is the GATE
          # on its log -- a probe that did not measure leaves no
          # "PERMUTATION libc:" line and the gate fails.
          #
          # WHY THE MEASUREMENT MOVED OUT OF THE TOOLS (OC-104). Until this
          # commit the permutation fact was measured BY running ea_non_iid with
          # an option after the operand. OC-104 makes the tools REFUSE that
          # shape, so the old probe would now report "no permutation observed"
          # -- which is false, and worse than no measurement, because the
          # refusal fires before getopt is ever reached. The libc fact is a
          # property of the C library, so it is measured with a twenty-line C
          # program that calls getopt directly and nothing else. The tools'
          # behaviour is asserted separately, below.
          set +e
          mkdir -p logs
          # NO HEREDOC HERE. A heredoc's closing delimiter must be at column 1,
          # which terminates the YAML block scalar: the workflow stopped
          # parsing as YAML the first time this step was written. printf keeps
          # every line inside the block's indentation. regression-workflows.sh
          # runs bash -n over this block, and PyYAML parses the file, so both
          # halves of that mistake are now caught locally.
          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <unistd.h>' \
            'int main(int argc, char **argv) {' \
            '    int opt, n = 0;' \
            '    while ((opt = getopt(argc, argv, "q")) != -1) if (opt == 0x71) n++;' \
            '    printf("parsed_q=%d optind=%d argc=%d%s", n, optind, argc, "\n");' \
            '    return 0;' \
            '}' > logs/gp.c
          cc -O1 -o logs/gp logs/gp.c
          {
            echo "## getopt permutation on this platform, measured without the tools"
            echo -n "PERMUTATION libc: "
            ./logs/gp operand 1 -q
            if ./logs/gp operand 1 -q | grep -q 'parsed_q=1'; then
              echo "PERMUTATION verdict: this libc PERMUTES -- an option after the operand IS parsed"
            else
              echo "PERMUTATION verdict: this libc does NOT permute -- same as Darwin arm64"
            fi

            # And the tools must now refuse that shape, identically to Darwin.
            # THE SIGNAL IS errorLevel 0, NOT THE PRESENCE OF A FILE. C14 claims
            # the -o path with a placeholder as soon as it is known, so a FAILED
            # run still leaves a report there -- `[ -s report.json ]` was true on
            # a run that exited 255. OC-80 records this exact mistake being made
            # in F04's controls.
            assessed() { grep -q '"errorLevel" : 0' "$1" 2>/dev/null && echo YES || echo no; }
            # 0/1 BYTES, NOT urandom: urandom declared width 1 is refused for
            # having 8-bit symbols, which would make the CONTROL arm fail and
            # every row meaningless. A fixture must satisfy its declared width.
            python3 -c "import os,sys; sys.stdout.buffer.write(bytes(b & 1 for b in os.urandom(1000000)))" > logs/perm.bin
            echo "fixture: $(wc -c < logs/perm.bin) bytes"

            rm -f logs/perm.json
            ./cpp/ea_non_iid -i -a -q -o logs/perm.json logs/perm.bin 1 >/dev/null 2>&1
            echo "REFUSAL options-before: exit=$? assessed=$(assessed logs/perm.json)"

            rm -f logs/perm.json
            ./cpp/ea_non_iid -i -a logs/perm.bin 1 -q -o logs/perm.json >logs/perm-late.txt 2>&1
            rc=$?
            a=$(assessed logs/perm.json)
            msg=no; grep -q 'appears after the file operand' logs/perm-late.txt && msg=YES
            echo "REFUSAL options-after: exit=$rc assessed=$a named=$msg"
            if [ "$rc" != 0 ] && [ "$a" = no ] && [ "$msg" = YES ]; then
              echo "REFUSAL verdict: refused with the naming message, as on Darwin arm64"
            else
              echo "REFUSAL verdict: *** NOT REFUSED *** exit=$rc assessed=$a named=$msg"
            fi

            # The A05-relevant half: a permuted -o aimed at the INPUT. Before
            # OC-104 the early identity guard was unarmed here and
            # writeJsonReport's choke point was what saved the capture
            # (OC-102). The refusal now fires ahead of both; the capture is
            # checked regardless, because that is the failure the project
            # cannot absorb.
            cp logs/perm.bin logs/permalias.bin
            before=$(sha256sum logs/permalias.bin | cut -d" " -f1)
            ./cpp/ea_non_iid -i -a logs/permalias.bin 1 -q -o logs/permalias.bin > logs/perm-alias.txt 2>&1
            echo "REFUSAL alias-after-operand: exit=$?"
            after=$(sha256sum logs/permalias.bin | cut -d" " -f1)
            [ "$before" = "$after" ] && echo "PERMUTATION capture-intact: YES" \
                                     || echo "PERMUTATION capture-intact: *** DESTROYED ***"
            sed -n "1,4p" logs/perm-alias.txt | sed "s/^/  alias stderr: /"
          } > logs/05c-getopt-permutation.log 2>&1
          cat logs/05c-getopt-permutation.log
          exit 0

      - name: "5d. A LATE --version: does permutation reach the prescan's blind spot?"
        run: |
          # MEASURED IN 8e6941f, FIXED IN OC-104, AND NOW ASSERTED. OC-80 noted
          # that glibc permutation might let a --version placed AFTER the
          # operand reach getopt, where the prescan -- which stops at the first
          # operand -- never sees it. 5c measured that glibc does permute,
          # promoting that note to a testable case; this step measured it on
          # both platforms (exit 255, nothing assessed, no report, via the
          # usage path); OC-104 then made the shape refuse explicitly. So the
          # gate moves from "it measured" to "no vacuous run, and the refusal
          # named the argument" -- which is what the fix pass owed.
          #
          # 5c's three lessons are applied here: set +e (the subject is exit
          # statuses), a 0/1 fixture (urandom at width 1 is refused), and
          # errorLevel 0 as the "assessed" signal (C14's placeholder means a
          # report FILE exists even on a failed run).
          set +e
          mkdir -p logs
          python3 -c "import os,sys; sys.stdout.buffer.write(bytes(b & 1 for b in os.urandom(1000000)))" > logs/lv.bin
          assessed() { grep -q '"errorLevel" : 0' "$1" 2>/dev/null && echo YES || echo no; }
          {
            echo "## a late --version on this platform"
            for t in ea_non_iid ea_iid ea_restart; do
              case $t in ea_restart) TAIL="1 0.8" ;; *) TAIL="1" ;; esac
              for form in control late late_with_o lateV; do
                rm -f logs/lv.json
                case $form in
                  control)     ./cpp/$t -i -q -o logs/lv.json logs/lv.bin $TAIL >logs/lv.out 2>&1 ;;
                  late)        ./cpp/$t -i -q logs/lv.bin $TAIL --version        >logs/lv.out 2>&1 ;;
                  late_with_o) ./cpp/$t -i -q -o logs/lv.json logs/lv.bin $TAIL --version >logs/lv.out 2>&1 ;;
                  lateV)       ./cpp/$t -i -q logs/lv.bin $TAIL -V               >logs/lv.out 2>&1 ;;
                esac
                rc=$?
                ban=no; grep -q 'Disclaimer: NIST-developed' logs/lv.out && ban=YES
                a=$(assessed logs/lv.json)
                ref=no; grep -q 'appears after the file operand' logs/lv.out && ref=YES
                vac=no
                if [ "$rc" = 0 ] && [ "$a" = no ]; then vac=YES; fi
                echo "LATEVERSION $t $form: exit=$rc banner=$ban assessed=$a refused=$ref vacuous=$vac"
              done
            done
            # a cluster fragment taken as -o's attached argument would leave a
            # stray file; name any that appear.
            for f in logs/*; do
              # 5c's artefacts live in the same directory, so they are named
              # here too -- otherwise six of its files read as strays and a
              # real stray would be lost among them (observed locally).
              case "$f" in logs/lv.bin|logs/lv.json|logs/lv.out|logs/0*|logs/??-*) ;;
                logs/gp|logs/gp.c|logs/perm.bin|logs/perm.json|logs/permalias.bin|logs/perm-alias.txt|logs/perm-late.txt) ;;
                *) echo "LATEVERSION stray-file: $f" ;;
              esac
            done
          } > logs/05d-late-version.log 2>&1
          if grep -q 'vacuous=YES' logs/05d-late-version.log; then
            echo "LATEVERSION VERDICT: at least one form exits 0 having assessed nothing -- a LIVE vacuous-run path" >> logs/05d-late-version.log
          else
            echo "LATEVERSION VERDICT: no vacuous run observed on this platform" >> logs/05d-late-version.log
          fi
          # Every LATE form must now be refused BY NAME. The control must not
          # be: a refusal that fires on the well-formed line is worse than the
          # defect. Counted rather than grepped, so a form that stopped being
          # measured cannot pass as a form that was refused.
          late_n=$(grep -c 'LATEVERSION .* \(late\|late_with_o\|lateV\):' logs/05d-late-version.log)
          late_ref=$(grep 'LATEVERSION .* \(late\|late_with_o\|lateV\):' logs/05d-late-version.log | grep -c 'refused=YES')
          ctl_ref=$(grep 'LATEVERSION .* control:' logs/05d-late-version.log | grep -c 'refused=YES')
          echo "LATEVERSION REFUSAL: ${late_ref} of ${late_n} late forms refused by name; ${ctl_ref} controls wrongly refused" >> logs/05d-late-version.log
          if [ "${late_n}" -eq 9 ] && [ "${late_ref}" -eq 9 ] && [ "${ctl_ref}" -eq 0 ]; then
            echo "LATEVERSION REFUSAL VERDICT: all 9 late forms refused, no control refused" >> logs/05d-late-version.log
          else
            echo "LATEVERSION REFUSAL VERDICT: *** MISMATCH *** ${late_ref}/${late_n} late, ${ctl_ref} controls" >> logs/05d-late-version.log
          fi
          cat logs/05d-late-version.log
          exit 0

      - name: "5e. NIST's 11 reference datasets, per dataset, with the repaired comparator"
        run: |
          # OC-107. `selftest` prints a pass/fail summary; this prints the
          # per-dataset value count and worst delta that compareresults.pl
          # computes and selftest discards, so the question "does this fork
          # agree with NIST's published reference outputs, and by how much" has
          # a two-platform answer rather than a Darwin-only one.
          #
          # set +e for the same reason as 5c and 5d: the subject is statuses.
          # The gate is on the log, below.
          set +e
          mkdir -p logs
          ./tools/compare-nist-reference.sh . > logs/05e-nist-reference.log 2>&1
          cat logs/05e-nist-reference.log
          exit 0

      - name: 6. The full suite and the outside-battery regression
        run: |
          set +e
          ( cd cpp/selftest && ./run-all-checks.sh ) > logs/06-run-all-checks-strict.log 2>&1
          echo "strict suite exit $?" >> logs/06-run-all-checks-strict.log
          ( cd cpp/selftest && ./run-all-checks.sh --allow-known-platform-deltas ) > logs/06-run-all-checks-platform.log 2>&1
          echo "platform-flag suite exit $?" >> logs/06-run-all-checks-platform.log
          # The suite prints only each regression's last four lines. Run the two
          # with platform-sensitive expectations standalone so their FULL output
          # reaches the artifact: a truncated failure is not a diagnosis.
          ( cd cpp/selftest && ./regression-restart.sh ) > logs/06-regression-restart-full.log 2>&1
          echo "regression-restart exit $?" >> logs/06-regression-restart-full.log
          ( cd cpp/selftest && ./regression-estimator-guards.sh ) > logs/06-regression-estimator-guards-full.log 2>&1
          echo "regression-estimator-guards exit $?" >> logs/06-regression-estimator-guards-full.log
          ( cd cpp/selftest && ./regression-outside-battery.sh ) > logs/06-outside-battery.log 2>&1
          echo "outside-battery exit $?" >> logs/06-outside-battery.log
          ( cd cpp/selftest && ./harness-inventory-mutation-test.sh ) > logs/06-mutation-inventory.log 2>&1
          echo "exit $?" >> logs/06-mutation-inventory.log
          ( cd cpp/selftest && ./outside-battery-mutation-test.sh ) > logs/06-mutation-corpus.log 2>&1
          echo "exit $?" >> logs/06-mutation-corpus.log
          # An explicit verdict, so the job's red/green means something. A job that
          # always reports failure is a job people stop reading, and the last
          # command's incidental exit status is not a verdict. The strict suite is
          # INFORMATIONAL: it carries the documented upstream #155 reference
          # deltas, which are macOS-only -- on Linux it passes, and that is itself
          # a second-platform result rather than a gate.
          fail=0
          gate() { # gate <label> <logfile> <expected-line>
            if grep -q "$3" "$2"; then echo "GATE PASS  $1"
            else echo "GATE FAIL  $1 (wanted '$3' in $2)"; fail=1; fi
          }
          # DERIVED, NOT HARDCODED. This gate read the literal "20 passed, 0
          # failed", so registering two new regression scripts failed the job
          # for a reason that had nothing to do with the platform it exists to
          # measure. That is rule 7's corollary -- a hardcoded expected count
          # inside a harness is a staleness trap -- found one layer up from
          # where it was first fixed, by the CI run that fixed it elsewhere.
          # ON LINUX ONE CHECK LEGITIMATELY CANNOT RUN (OC-66).
          # regression-platform-deltas.sh exercises the known-platform-delta
          # manifest, and Linux is the platform NIST's reference data came from,
          # so selftest reports no differences and there is nothing to check
          # against. It used to print "SKIPPED (not a pass)" and return 0, so
          # the abstention was counted among the 22 here. It now exits 2, which
          # run-all-checks reports as COULD NOT RUN -- apart from both pass and
          # fail -- so the expected shape on THIS platform is N-1 passed with
          # exactly one could-not-run, and the gate names which one. An
          # abstention is allowed; an unexplained one is not.
          TOTAL="$(sed -n 's/^EXPECTED_TOTAL_CHECKS=\([0-9]*\)$/\1/p' \
                   cpp/selftest/run-all-checks.sh | head -1)"
          if [ -z "$TOTAL" ]; then
            echo "GATE FAIL  cannot read EXPECTED_TOTAL_CHECKS from run-all-checks.sh"; fail=1
          else
            gate "full suite (platform flag)" logs/06-run-all-checks-platform.log \
                 "$((TOTAL - 1)) passed, 0 failed, 1 could not run"
            gate "the one abstention is the expected one" logs/06-run-all-checks-platform.log \
                 "could-not-run: regression-platform-deltas"
            gate "build state reached the summary" logs/06-run-all-checks-platform.log \
                 "checks declared the artefact they measured"
          fi
          # OC-72: oracle-selftest.sh is rule 7's best exemplar and was run by
          # nothing. Run it here, on the other long double format, because the
          # oracles it checks produce the figures the record cites.
          ( cd audits/2026-10-11-independent-audit/oracles && ./oracle-selftest.sh ) \
              > logs/07-oracle-selftest.log 2>&1 || true
          # F11 (OC-84): this workflow carried an empty `if true; then / fi` --
          # a bash syntax error -- immediately below this point, which aborted
          # the step and meant the five gates after it never ran. The check that
          # catches that is run here as well as in the suite, because this is
          # the file it was written for.
          ./cpp/selftest/regression-workflows.sh > logs/07-workflows.log 2>&1 || true
          # regression-docs.sh IN FULL (OC-90). The suite prints only a failing
          # member's tail, and this member emits about twenty check lines -- so
          # a failure that reproduces only here was visible as "FAIL" with no
          # indication of which check. Logged separately and gated separately;
          # the suite still runs it too, and the two must agree.
          ./cpp/selftest/regression-docs.sh > logs/07-regression-docs.log 2>&1 || true
          gate "oracle self-test" logs/07-oracle-selftest.log "oracle-selftest: PASS"
          gate "workflow shell syntax" logs/07-workflows.log "regression-workflows: PASS"
          gate "docs checks (logged in full)" logs/07-regression-docs.log "regression-docs: PASS"
          # 5c measures the libc fact and ASSERTS the refusal (OC-104). The
          # permutation line is still gated as "it measured", because what the
          # libc does is a fact to record, not a pass or a fail; the refusal
          # and the capture are gated as outcomes.
          gate "getopt permutation measured" logs/05c-getopt-permutation.log "PERMUTATION libc:"
          gate "a late option is refused by name" logs/05c-getopt-permutation.log "REFUSAL verdict: refused with the naming message"
          gate "the capture survived the alias-after-operand form" logs/05c-getopt-permutation.log "PERMUTATION capture-intact: YES"
          # 5d now gates on the OUTCOME, which is what the fix pass owed
          # (OC-103 -> OC-104): no vacuous run, and all nine late forms refused
          # by name with no control wrongly refused.
          gate "late --version measured" logs/05d-late-version.log "LATEVERSION VERDICT:"
          # OC-107: Linux x86-64 is the platform NIST's reference data was
          # produced on, and known-platform-deltas.txt deliberately lists NO
          # block for it -- so here, unlike Darwin arm64, every one of the 11
          # datasets must agree outright. "11 run" is gated separately from
          # "0 disagreeing" so that a loop that stopped early cannot pass as
          # agreement.
          gate "all 11 reference datasets ran" logs/05e-nist-reference.log "datasets run: 11"
          gate "every reference dataset agrees on glibc" logs/05e-nist-reference.log "disagreeing: 0"
          gate "no vacuous run on this platform" logs/05d-late-version.log "LATEVERSION VERDICT: no vacuous run observed"
          gate "all late forms refused, no control refused" logs/05d-late-version.log "LATEVERSION REFUSAL VERDICT: all 9 late forms refused"
          gate "outside-battery regression" logs/06-outside-battery.log "regression-outside-battery: PASS"
          gate "script-inventory mutations" logs/06-mutation-inventory.log "harness-inventory-mutation-test: PASS"
          gate "corpus mutations"           logs/06-mutation-corpus.log   "outside-battery-mutation-test: PASS"
          gate "restart regression"         logs/06-regression-restart-full.log "regression-restart: PASS"
          gate "estimator guards"           logs/06-regression-estimator-guards-full.log "regression-estimator-guards: PASS"
          echo "--- informational (not gated) ---"
          tail -2 logs/06-run-all-checks-strict.log
          exit "${fail}"

      - name: 7. Summary
        if: always()
        run: |
          echo "## x86-64 platform facts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat logs/01-float-environment.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### canary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat logs/04-canary-summary.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### R-1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat logs/05-r1.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-64-platform-facts
          path: logs/
          retention-days: 90
